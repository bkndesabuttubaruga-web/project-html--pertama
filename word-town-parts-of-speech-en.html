<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Town – Parts of Speech Arena</title>
<style>
:root{--ink:#1d0f45;--bg1:#4a2aa8;--bg2:#1c1050;--n:#ff7ab6;--v:#4ee1a0;--a:#ffd23f;--d:#5bc0ff;--p:#ff9b54;--r:#b18cff;--c:#7af0e0}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;color:#fff;background:radial-gradient(circle at 20% 8%,var(--bg1),var(--bg2) 72%) fixed;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#bg span{position:absolute;bottom:-40px;font-weight:900;opacity:.13;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) rotate(25deg)}}
#cf{position:fixed;inset:0;pointer-events:none;z-index:50}
.scr{display:none;position:relative;max-width:560px;margin:0 auto;min-height:100dvh;padding:14px;flex-direction:column;gap:12px}
.scr.on{display:flex}
.top{position:fixed;top:10px;right:10px;z-index:40;display:flex;gap:8px}
.top button{width:42px;height:42px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:1.1rem}
.top button.off{opacity:.45}
.top button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
/* menu */
#menu{justify-content:center;align-items:center;text-align:center;gap:16px}
h1{font-size:clamp(3rem,15vw,4.6rem);line-height:1;letter-spacing:1px;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
h1 i{display:inline-block;font-style:normal;animation:pop .6s cubic-bezier(.3,1.8,.5,1) both,wave 2s ease-in-out .9s infinite}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.sub{font-weight:800;font-size:1.05rem;color:#ffe9a8;margin-top:-4px}
.mas{display:flex;align-items:center;gap:10px;text-align:left}
.fox{font-size:4rem;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-5deg)}}
.bub{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:700;font-size:.95rem;box-shadow:0 4px 0 var(--ink);max-width:260px}
.mode{width:100%;text-align:left;border:4px solid var(--ink);border-radius:24px;padding:16px 18px;box-shadow:0 7px 0 var(--ink);color:var(--ink);display:flex;gap:14px;align-items:center;transition:transform .12s}
.mode:hover{transform:translateY(-3px) rotate(-.6deg)}
.mode:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.mode .ic{font-size:2.6rem}
.mode b{font-size:1.4rem;display:block}
.mode small{font-size:.85rem;font-weight:700;opacity:.8;display:block}
.mode em{font-style:normal;font-size:.8rem;font-weight:800;background:var(--ink);color:#fff;border-radius:99px;padding:2px 10px;display:inline-block;margin-top:5px}
.ghost{background:rgba(255,255,255,.15);border:3px dashed #fff;border-radius:99px;padding:10px 22px;font-weight:800}
/* bars */
.bar{display:flex;gap:8px;align-items:center;padding-right:150px}
.back{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:1.2rem;font-weight:900}
.stat{background:rgba(255,255,255,.16);border:3px solid var(--ink);border-radius:99px;padding:6px 12px;font-weight:900;white-space:nowrap}
/* rain */
#field{position:relative;flex:1;min-height:300px;border:4px solid var(--ink);border-radius:24px;background:rgba(255,255,255,.08);overflow:hidden;box-shadow:0 6px 0 var(--ink)}
#field::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,#ff5d73 0 14px,transparent 14px 24px)}
.w{position:absolute;padding:6px 15px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:99px;font-weight:900;font-size:1.1rem;box-shadow:0 4px 0 var(--ink);will-change:top;white-space:nowrap}
.w.tg{background:#ffe27a;box-shadow:0 4px 0 var(--ink),0 0 0 5px rgba(255,255,255,.5);transform:scale(1.08)}
.w.pop{animation:poof .3s forwards}
.w.bad{animation:poof .35s forwards;background:#ff6b81}
@keyframes poof{to{transform:scale(1.8) rotate(12deg);opacity:0}}
.hint{min-height:2.4rem;text-align:center;font-weight:800;display:flex;align-items:center;justify-content:center}
.hint.ok{color:#8bffc9}.hint.no{color:#ffb0bd}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
/* buttons */
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cb{background:var(--k);color:var(--ink);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:8px 2px;display:flex;flex-direction:column;align-items:center;line-height:1.15;transition:transform .08s}
.cb b{font-size:.82rem}.cb small{font-size:.6rem;font-weight:700;opacity:.8}
.cb:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.cb.ok{animation:jump .5s;box-shadow:0 5px 0 var(--ink),0 0 0 4px #fff}
.cb.no{opacity:.4;animation:shake .4s}
@keyframes jump{40%{transform:translateY(-14px) scale(1.1)}}
/* detective */
.prog{height:14px;background:rgba(255,255,255,.18);border:3px solid var(--ink);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--v),var(--a));transition:width .4s}
#card,#zcard,#lc{background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:24px;box-shadow:0 7px 0 var(--ink);padding:20px 18px}
#card.in,#zcard.in,#lc.in{animation:cardin .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes cardin{from{transform:translateX(60px) rotate(4deg);opacity:0}}
.q{font-weight:800;font-size:.9rem;opacity:.7;margin-bottom:10px}
#sent,#zs{font-size:1.5rem;font-weight:800;line-height:1.55}
mark{background:var(--a);color:var(--ink);border-radius:10px;padding:1px 9px;border:3px solid var(--ink);display:inline-block;animation:wig 1.4s ease-in-out infinite;transition:background .3s}
@keyframes wig{50%{transform:rotate(-3deg) scale(1.06)}}
#exp{min-height:3.4rem;font-weight:700;line-height:1.4;padding:0 4px}
#exp.ok{color:#8bffc9}#exp.no{color:#ffc2cc}
.big{align-self:center;background:var(--a);color:var(--ink);font-weight:900;font-size:1.1rem;border:4px solid var(--ink);border-radius:99px;padding:12px 30px;box-shadow:0 6px 0 var(--ink);display:none;animation:pop .4s both}
.big:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
/* result */
#res{justify-content:center;align-items:center;text-align:center}
.stars{font-size:3.4rem;letter-spacing:6px}
.stars span{display:inline-block;animation:pop .6s cubic-bezier(.3,1.8,.5,1) both}
.stars .dim{filter:grayscale(1) brightness(.6)}
#rsc{font-size:5rem;font-weight:900;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);color:var(--a)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* guide */
#guide{position:fixed;inset:0;z-index:60;background:rgba(15,6,45,.8);display:none;align-items:center;justify-content:center;padding:14px}
#guide.on{display:flex}
.gbox{background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:26px;max-width:520px;width:100%;max-height:90dvh;overflow:auto;padding:16px;animation:pop .35s both}
.gbox h2{margin-bottom:8px}
.g{border-left:12px solid var(--k);border-radius:8px;background:#f4f0ff;padding:7px 10px;margin:7px 0;font-size:.9rem;line-height:1.35}
#bg b{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.1}to{opacity:.9}}
@keyframes wave{50%{translate:0 -9px}}
#kk{position:absolute;left:10px;bottom:14px;font-size:2.3rem;z-index:1}
#kk.kj{animation:jump .5s}
.fl{position:fixed;z-index:55;font-weight:900;font-size:1.5rem;pointer-events:none;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;color:#ffd23f;animation:flt .9s forwards}
@keyframes flt{to{transform:translateY(-70px) scale(1.3);opacity:0}}
.bn{position:fixed;left:50%;top:36%;z-index:55;pointer-events:none;font-size:clamp(2.2rem,11vw,3.6rem);font-weight:900;color:var(--a);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);white-space:nowrap;animation:bnr 1.3s forwards}
@keyframes bnr{0%{transform:translate(-50%,0) scale(0) rotate(-12deg)}25%{transform:translate(-50%,0) scale(1.15) rotate(3deg)}75%{transform:translate(-50%,-10px) scale(1)}100%{transform:translate(-50%,-40px);opacity:0}}
.claim{font-size:1.7rem;font-weight:900;margin:2px 0 12px;color:#7a3cff}
.tfr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf{font-size:1.3rem;font-weight:900;padding:18px 0;border:4px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink);color:var(--ink)}
.tf.yes{background:var(--v)}.tf.no{background:#ff6b81}
.tf:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}
#lc{flex:1;overflow:auto}
#lc h2{font-size:1.45rem;margin-bottom:8px;line-height:1.3}
#lc p{line-height:1.5;font-weight:600;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.chip{background:var(--k,#e6e0f5);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:4px 11px;font-weight:800;text-align:center;display:inline-block;animation:pop .5s cubic-bezier(.3,1.8,.5,1) both}
.chip small{display:block;font-size:.58rem;font-weight:800}
.tipb{background:#fff7d1;border:3px dashed var(--ink);border-radius:14px;padding:9px 11px;font-weight:700;font-size:.92rem;margin-top:10px;line-height:1.4}
#lc .mode{margin-top:10px;padding:12px 16px}
#lc .fox{font-size:3rem}
@keyframes talk{50%{transform:scale(1.12) rotate(-6deg)}}
.fox.talk{animation:talk .3s infinite}
.qo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.qo .ghost{grid-column:1/-1;color:var(--ink);border-color:var(--ink)}
.rk{width:100%;background:rgba(255,255,255,.14);border:3px solid var(--ink);border-radius:18px;padding:10px 14px;font-weight:800;text-align:center}
.rk>i{display:block;height:10px;border-radius:9px;background:linear-gradient(90deg,var(--v),var(--a));margin-top:7px;transition:width .6s}
.bgs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:9px}
.bg{font-size:1.35rem;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:1px 6px}
.bg.lk{filter:grayscale(1);opacity:.35}
.rk small{display:block;margin-top:5px;opacity:.85}
.pw{display:flex;gap:10px;justify-content:center}
.pb{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:99px;padding:7px 16px;font-weight:900;box-shadow:0 4px 0 var(--ink)}
.pb:disabled{opacity:.35}.pb:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.w.gd{background:linear-gradient(135deg,#fff3a0,#ffd23f);animation:glow .8s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 4px 0 var(--ink),0 0 18px 6px #ffd23f}}
#field.fire{border-color:#ff8a2b;box-shadow:0 0 0 3px #ffb347,0 0 30px #ff6b2b}
#field.ice{background:rgba(120,200,255,.3)}
.fx{position:fixed;inset:0;z-index:45;pointer-events:none;opacity:.4;animation:fxo .4s forwards}
@keyframes fxo{to{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head>
<body>
<div id="bg" aria-hidden="true"></div>
<canvas id="cf"></canvas>
<div class="top"><button id="bG2" title="Cheat sheet" aria-label="Cheat sheet">📖</button><button id="bMus" title="Music" aria-label="Music">🎵</button><button id="bSnd" title="Sound" aria-label="Sound">🔊</button></div>

<section id="menu" class="scr on">
  <h1 id="ttl" aria-label="Word Town"></h1>
  <div class="sub">Parts of Speech Arena for English champions</div>
  <div class="mas"><div class="fox">🦊</div><div class="bub" id="tip"></div></div>
  <div class="rk" id="rk"></div>
  <button class="mode" id="mL" style="background:#fff"><span class="ic">🎓</span><span><b>Learn First</b><small>What are parts of speech? Meet the 7 word types.</small></span></button>
  <button class="mode" id="m1" style="background:var(--d)"><span class="ic">🌧️</span><span><b>Word Rain</b><small>Words are falling! Guess their type before they hit the ground.</small><em id="b1">Best 0</em></span></button>
  <button class="mode" id="m2" style="background:var(--n)"><span class="ic">🕵️</span><span><b>Sentence Detective</b><small>Use the sentence clues to find the type of the highlighted word.</small><em id="b2">Best 0</em></span></button>
  <button class="mode" id="m3" style="background:var(--a)"><span class="ic">⚡</span><span><b>Lightning 30s</b><small>True or false? Answer fast. A wrong answer costs time!</small><em id="b3">Best 0</em></span></button>
  <button class="ghost" id="bG">📖 Open Cheat Sheet</button>
</section>

<section id="rain" class="scr">
  <div class="bar"><button class="back" aria-label="Back">←</button><div class="stat">⭐ <b id="rS">0</b></div><div class="stat" id="rC">🔥 x0</div><div class="stat" id="rL"></div></div>
  <div id="field"></div>
  <div class="pw"><button class="pb" id="pF">❄️ Freeze <b id="nF">0</b></button><button class="pb" id="pB">💣 Bomb <b id="nB">0</b></button></div>
  <div class="hint" id="rH">Answer the lowest word (highlighted yellow)!</div>
  <div class="btns" id="rB"></div>
</section>

<section id="det" class="scr">
  <div class="bar"><button class="back" aria-label="Back">←</button><div class="stat">⭐ <b id="dS">0</b></div><div class="stat" id="dC">🔥 x0</div><div class="stat" id="dN">1/10</div></div>
  <div class="prog"><i id="dP"></i></div>
  <div id="card"><div class="q">What type of word is highlighted?</div><p id="sent"></p></div>
  <div id="exp"></div>
  <div class="btns" id="dB"></div>
  <button class="big" id="next">Next ➜</button>
</section>

<section id="learn" class="scr">
  <div class="bar"><button class="back" aria-label="Back">←</button><div class="prog" style="flex:1"><i id="lP"></i></div></div>
  <div id="lc"></div>
  <div class="row"><button class="ghost" id="lPrev">‹ Back</button><button class="big" id="lNext" style="display:block">Next ➜</button></div>
</section>

<section id="blz" class="scr">
  <div class="bar"><button class="back" aria-label="Back">←</button><div class="stat">⭐ <b id="zS">0</b></div><div class="stat" id="zC">🔥 x0</div><div class="stat" id="zT">⏱ 30</div></div>
  <div class="prog"><i id="zP" style="width:100%;transition:width 1s linear"></i></div>
  <div id="zcard"><div class="q">Is the highlighted word a…</div><div class="claim" id="zk"></div><p id="zs"></p></div>
  <div class="tfr"><button class="tf no" id="zN">✖ False</button><button class="tf yes" id="zY">✔ True</button></div>
</section>

<section id="res" class="scr">
  <div class="mas"><div class="fox" id="rf">🦊</div><div class="bub" id="rm"></div></div>
  <div class="stars" id="st"></div>
  <div id="rsc">0</div>
  <div class="sub" id="nb"></div>
  <div class="row"><button class="mode" id="again" style="background:var(--v);width:auto"><b>Play again</b></button><button class="mode" id="home" style="background:var(--a);width:auto"><b>Menu</b></button></div>
</section>

<div id="guide"><div class="gbox"><h2>📖 Parts of Speech Cheat Sheet</h2><div id="gl"></div><div class="row" style="margin-top:10px"><button class="ghost" style="color:var(--ink);border-color:var(--ink)" id="gx">Close</button></div></div></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const T=[["n","Noun","Naming word","Names a person, thing, place, or idea.","teacher, Jakarta, courage"],
["v","Verb","Action word","Shows an action or a state.","run, write, sleep"],
["a","Adjective","Describing word","Describes a noun.","tall, spicy, brave"],
["d","Adverb","How/when word","Describes a verb, an adjective, or another adverb.","quickly, always, very"],
["p","Pronoun","Replacement word","Takes the place of a noun.","he, they, mine"],
["r","Preposition","Position word","Shows a relationship of place or time.","in, under, during"],
["c","Conjunction","Joining word","Joins words or sentences.","and, but, because"]];
const nm=k=>T.find(t=>t[0]===k)[1]+" ("+T.find(t=>t[0]===k)[2]+")";
const WD={n:"cat teacher school happiness river pizza Jakarta courage phone garden music friend dog mother book table window city ocean bicycle doctor dragon pencil kitchen mountain robot guitar banana island rainbow football library Bali moon galaxy sandwich notebook camera pirate treasure forest bridge elephant honesty freedom kindness computer wizard castle backpack cookie volcano astronaut dinosaur jungle adventure birthday princess neighbor student mirror ticket scooter jacket cafeteria stadium festival poem puzzle shadow thunder bakery diamond fireworks spaceship superhero keyboard tablet trophy champion rocket planet butterfly dolphin tiger mango noodles village",v:"run eat write jump sleep swim think laugh build sing read draw climb listen borrow invite explore practice celebrate imagine follow discover protect collect decide remember forget understand believe create enjoy choose bring carry teach learn buy sell speak grow arrive finish wander chase gather wake lose bake solve repair guess hug fix stretch relax cheer prepare perform spell translate memorize organize produce wonder polish deliver remind",a:"beautiful tall happy spicy tiny brave noisy clever cold shiny lazy heavy friendly gigantic polite delicious dangerous colorful smart funny curious generous hungry sleepy fragile ancient modern magical fluffy crunchy sweet bitter smooth rough bright famous honest creative silly wise lucky proud nervous tired empty fresh slippery sticky strange huge expensive enormous cheerful gloomy rude shy jealous sensitive peaceful adorable terrible wonderful awful grumpy cozy messy tidy crowded rusty juicy sour tasty thirsty scary calm patient",d:"quickly slowly always carefully loudly never happily often quietly very soon sometimes usually bravely gently suddenly rarely badly easily nearly extremely really too almost already finally seldom politely angrily silently eagerly perfectly honestly safely tightly patiently peacefully carelessly lazily joyfully noisily rapidly clearly nervously calmly warmly thoroughly strongly firmly mostly hardly barely",p:"he she they we it you them mine herself us ours I him me myself himself themselves yours theirs hers itself ourselves yourself who whom someone everyone nobody anything something nothing everybody anyone everything somebody anybody whoever",r:"in on under behind between beside above through during across over with underneath into onto within without by at from to for of toward among against along beneath beyond except throughout alongside upon amid via",c:"and but or because although while if until unless though whereas nor whether"};
const WL=[];for(const k in WD)WD[k].split(" ").forEach(w=>WL.push([w,k]));
const SD=[
["The [clever] fox jumped over the fence.","a","Clever describes the noun 'fox'."],
["She sings [beautifully] every morning.","d","Beautifully describes the verb 'sings' (how she sings)."],
["[They] are playing football in the park.","p","They replaces a plural noun (a group of people)."],
["My brother put the book [on] the table.","r","On shows the place relationship between book and table."],
["I wanted to go out, [but] it was raining.","c","But joins two clauses that contrast with each other."],
["The [children] laughed at the funny clown.","n","Children names people (a plural noun)."],
["Dina [writes] a diary every night.","v","Writes shows an action."],
["He is a [very] tall boy.","d","Very describes the adjective 'tall'."],
["We waited [until] the rain stopped.","c","Until joins two clauses and marks a time limit."],
["The cat is hiding [under] the sofa.","r","Under shows where the cat is in relation to the sofa."],
["The prize belongs to [her].","p","Her replaces a girl's or woman's name."],
["The [spicy] noodles made me cough.","a","Spicy describes the noun 'noodles'."],
["Rina [practices] the piano after school.","v","Practices is the action Rina does."],
["Please speak [softly] in the library.","d","Softly describes how to 'speak'."],
["The [library] closes at five.","n","Library names a place."],
["I like tea [and] coffee.","c","And joins two nouns: tea and coffee."],
["The bird flew [across] the river.","r","Across shows the direction of movement relative to the river."],
["The [teacher] gave us homework.","n","Teacher names a person (a profession)."],
["A [huge] wave hit the shore.","a","Huge describes the noun 'wave'."],
["The kids [ran] to the beach.","v","Ran is an action (the past tense of run)."],
["Tom [never] eats breakfast.","d","Never describes how often 'eats' happens."],
["Can you help [me]?","p","Me replaces the speaker."],
["We stayed home [because] it was stormy.","c","Because joins two clauses and gives a reason."],
["The [mountain] looks amazing at sunrise.","n","Mountain names a thing or a place."]];
const XT={n:" is a noun: it names a person, thing, place, or idea.",v:" is a verb: it shows an action or a state.",a:" is an adjective: it describes a noun.",d:" is an adverb: it describes a verb, an adjective, or another adverb.",p:" is a pronoun: it takes the place of a noun.",r:" is a preposition: it shows a relationship of place, direction, or time.",c:" is a conjunction: it joins words or sentences."};
`n|My [brother] plays video games every afternoon.
n|The [volcano] erupted early in the morning.
n|We visited a beautiful [island] last holiday.
n|The [doctor] checked my temperature.
n|A [dragon] guarded the golden treasure.
n|Rina keeps her [notebook] in her backpack.
n|The [astronaut] floated inside the spaceship.
n|Sinta bought a new [guitar] yesterday.
n|[Honesty] is important in every friendship.
n|The [elephant] drank water from the river.
v|The students [climb] the hill every Sunday.
v|My mother [cooks] dinner at six o'clock.
v|We [celebrate] Independence Day with a parade.
v|Please [listen] to the teacher carefully.
v|He [borrowed] a comic from the library.
v|The cat [chased] the mouse across the kitchen.
v|I [remember] our first day at school.
v|The team [won] the final match.
v|Dewi [discovered] a secret door in the garden.
v|They [protect] the forest from fire.
a|The [delicious] soup warmed everyone.
a|A [curious] kitten followed me home.
a|The [ancient] temple is very famous.
a|Budi is a [generous] boy who shares his lunch.
